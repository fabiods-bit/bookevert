<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookVert - Sistema de Empréstimos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:      #1c1c1a;
      --sage:     #3d6b52;
      --sage-lt:  #d8ead0;
      --clay:     #c4703a;
      --paper:    #f5f0e8;
      --paper-dk: #ede8dc;
      --white:    #ffffff;
      --muted:    #7a7468;
      --border:   #cfc9bc;
      --radius:   12px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Barlow', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--paper-dk); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .display { font-family: 'Playfair Display', serif; }

    .btn {
      display: inline-flex;
      align-items: center; gap: 7px;
      font-family: 'Barlow', sans-serif;
      font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: var(--radius);
      border: none; cursor: pointer;
      transition: all .18s ease;
      text-decoration: none;
    }
    .btn-primary { background: var(--sage); color: #fff; }
    .btn-primary:hover { background: #2f5440; }
    .btn-secondary { background: var(--clay); color: #fff; }
    .btn-secondary:hover { background: #a85c2e; }
    .btn-ghost { background: transparent; color: var(--sage); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--sage-lt); border-color: var(--sage); }
    .btn-full { width: 100%; justify-content: center; }
    .btn-sm { font-size: 12px; padding: 7px 13px; }

    .input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--ink);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      transition: border-color .15s;
      outline: none;
    }
    .input:focus { border-color: var(--sage); }
    .input::placeholder { color: var(--muted); }
    .label {
      display: block;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin-bottom: 7px;
    }
    .form-group { margin-bottom: 16px; position: relative; }

    .card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px; font-weight: 600;
      color: var(--ink);
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 18px;
    }
    .card-title i { color: var(--sage); font-size: 15px; }

    .badge {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      padding: 3px 9px; border-radius: 99px;
    }
    .badge-sage { background: var(--sage-lt); color: var(--sage); }
    .badge-clay { background: #f7e6d8; color: var(--clay); }
    .badge-muted { background: var(--paper-dk); color: var(--muted); border: 1px solid var(--border); }

    .divider { height: 1.5px; background: var(--border); opacity: .6; border: none; margin: 0; }

    #tela-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: var(--paper);
      position: relative;
      overflow: hidden;
    }
    #tela-login::before {
      content: '';
      position: absolute;
      top: -120px; right: -120px;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--sage-lt) 0%, transparent 70%);
      pointer-events: none;
    }
    #tela-login::after {
      content: '';
      position: absolute;
      bottom: -80px; left: -80px;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, #f7e6d8 0%, transparent 70%);
      pointer-events: none;
    }

    .login-box {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%; max-width: 420px;
      position: relative; z-index: 1;
      box-shadow: 0 10px 40px rgba(0,0,0,.05);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-top: 7px;
    }

    header {
      background: var(--ink);
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1.5px solid rgba(255,255,255,.08);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-user { text-align: right; }
    .header-user .name { font-size: 13px; font-weight: 600; color: #fff; }
    .header-user .contact { font-size: 11px; color: rgba(255,255,255,.5); }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn-logout {
      background: transparent; border: none; cursor: pointer;
      color: rgba(255,255,255,.5);
      font-size: 18px; padding: 6px;
      border-radius: 8px; transition: color .15s;
      line-height: 1;
    }
    .btn-logout:hover { color: #f87171; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px; color: var(--ink);
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .section-title i { color: var(--sage); font-size: 16px; }
    .section-title .refresh-btn {
      margin-left: auto;
      font-family: 'Barlow', sans-serif;
      font-size: 12px; font-weight: 600;
      color: var(--sage); background: none; border: none;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      padding: 5px 8px; border-radius: 7px;
      transition: background .15s;
    }
    .section-title .refresh-btn:hover { background: var(--sage-lt); }

    .grid-top {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 780px) {
      .grid-top { grid-template-columns: 1fr; }
    }

    .grid-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 640px) {
      .grid-bottom { grid-template-columns: 1fr; }
    }

    .book-item {
      display: flex;
      align-items: center; justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: border-color .15s;
    }
    .book-item:hover { border-color: var(--sage); }
    .book-item + .book-item { margin-top: 10px; }
    .book-item .info .title { font-size: 14px; font-weight: 600; color: var(--ink); }
    .book-item .info .author { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .book-item .info .requester { font-size: 11px; font-weight: 600; color: var(--sage); margin-top: 5px; }

    .reserve-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 580px) {
      .reserve-grid { grid-template-columns: 1fr; }
    }
    .reserve-card {
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color .15s;
    }
    .reserve-card:hover { border-color: var(--sage); }
    .reserve-card .r-title { font-size: 14px; font-weight: 700; color: var(--ink); }
    .reserve-card .r-author { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center; justify-content: center; gap: 7px;
      padding: 9px 14px;
      background: #dcf8e9; color: #1a7a3c;
      border: 1.5px solid #b2e8c7;
      border-radius: 10px;
      font-size: 12px; font-weight: 700;
      text-decoration: none;
      transition: background .15s;
      width: 100%;
    }
    .btn-whatsapp:hover { background: #c3f0d5; }

    .btn-confirm {
      width: 100%;
      padding: 9px 14px;
      background: var(--sage); color: #fff;
      border: none; border-radius: 10px;
      font-size: 12px; font-weight: 700;
      cursor: pointer; transition: background .15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-confirm:hover { background: #2f5440; }

    .waiting-label {
      width: 100%;
      padding: 9px 14px;
      background: var(--paper-dk);
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      font-size: 11px; font-weight: 600;
      text-align: center;
    }

    .loan-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: border-color .15s;
    }
    .loan-item + .loan-item { margin-top: 10px; }
    .loan-item:hover { border-color: var(--sage); }
    .loan-item-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .loan-item .deadline { text-align: right; }
    .loan-item .deadline .label-sm { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .loan-item .deadline .date { font-size: 13px; font-weight: 700; color: var(--ink); }

    .scroll-list { max-height: 300px; overflow-y: auto; padding-right: 4px; }
    .empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 13px; font-style: italic; }

    #toast {
      position: fixed;
      bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff;
      padding: 12px 22px; border-radius: 99px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 6px 24px rgba(0,0,0,.2);
      opacity: 0; transition: opacity .25s;
      pointer-events: none; z-index: 1000;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center;
      justify-content: center;
      z-index: 200; padding: 16px;
    }
    .overlay .dialog {
      background: var(--white); border-radius: 18px;
      padding: 28px 28px 24px; max-width: 380px; width: 100%;
      box-shadow: 0 12px 48px rgba(0,0,0,.2);
    }
    .overlay .dialog h3 { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 10px; }
    .overlay .dialog p { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .overlay .dialog .dialog-actions { display: flex; gap: 10px; margin-top: 22px; }
    .overlay .dialog .dialog-actions button { flex: 1; }

    .btn-cancel-dialog {
      padding: 11px; border-radius: 10px; background: var(--paper-dk);
      color: var(--ink); border: 1.5px solid var(--border);
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s; font-family: 'Barlow', sans-serif;
    }
    .btn-cancel-dialog:hover { background: var(--border); }

    .btn-ok-dialog {
      padding: 11px; border-radius: 10px; background: var(--sage); color: #fff; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s; font-family: 'Barlow', sans-serif;
    }
    .btn-ok-dialog:hover { background: #2f5440; }

    .login-erro-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      color: #b91c1c;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div id="toast"></div>

  <div id="confirm-overlay" class="overlay hidden">
    <div class="dialog">
      <h3 id="confirm-title">Confirmar</h3>
      <p id="confirm-msg"></p>
      <div class="dialog-actions">
        <button class="btn-cancel-dialog" onclick="fecharConfirm()">Cancelar</button>
        <button class="btn-ok-dialog" onclick="confirmarAcao()">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="tela-login">
    <div class="login-box">
      <div class="login-logo">
        <h1 class="display" style="font-size: 32px; color: var(--sage);">BookVert</h1>
        <div class="tagline">Um bom Vertiano sempre compartilha sabedoria</div>
      </div>

      <div id="login-erro" class="login-erro-box hidden">
        <i class="fa-solid fa-circle-exclamation" style="flex-shrink:0;"></i>
        <span id="login-erro-msg">Usuário ou senha inválidos.</span>
      </div>

      <div class="form-group">
        <label class="label">Usuário</label>
        <input type="text" id="usuario-input" class="input" placeholder="seu_username">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="label">Senha</label>
        <input type="password" id="senha-input" class="input" placeholder="••••••••">
      </div>

      <button class="btn btn-primary btn-full" id="btn-login" onclick="executarLogin()">
        Entrar <i class="fa-solid fa-right-to-bracket"></i>
      </button>
    </div>
  </div>

  <div id="app-principal" class="hidden">
    <header>
      <div class="header-inner">
        <div class="header-logo">
          <span style="font-weight:700; color:#fff;">Book</span><span>Vert</span>
        </div>
       
        <div class="header-actions">
          <div class="header-user">
            <div class="name" id="user-display-name">Carregando...</div>
            <div class="contact" id="user-display-contact"></div>
          </div>
          <button class="btn-logout" onclick="fazerLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <main>
      <div class="grid-top">
        <div class="card" style="height: fit-content;">
          <div class="card-title"><i class="fa-solid fa-book"></i> Pedir Livro</div>

          <div class="form-group">
            <label class="label">Título do Livro</label>
            <input type="text" id="req-titulo" class="input" placeholder="Ex: O Alquimista" autocomplete="off" oninput="validarFormPedido()">
          </div>

          <div class="form-group">
            <label class="label">Autor</label>
            <input type="text" id="req-autor" class="input" placeholder="Ex: Paulo Coelho" autocomplete="off" oninput="validarFormPedido()">
          </div>

          <button class="btn btn-primary btn-full" id="btn-publicar-pedido" onclick="enviarSolicitacao()" disabled style="opacity: 0.6; cursor: not-allowed;">
            <i class="fa-solid fa-paper-plane"></i> Publicar Pedido
          </button>
        </div>

        <div class="card">
          <div class="section-title">
            <span><i class="fa-solid fa-table-list"></i> Mural de Pedidos</span>
            <button class="refresh-btn" onclick="carregarMural()"><i class="fa-solid fa-arrows-rotate"></i> Atualizar</button>
          </div>
          <div class="scroll-list" id="mural-container">
            <div class="empty-state">Nenhum pedido em aberto.</div>
          </div>
        </div>
      </div>

      <div class="grid-bottom">
        <div class="card">
          <div class="section-title">
            <span><i class="fa-solid fa-comments"></i> Em Negociação</span>
            <button class="refresh-btn" onclick="carregarReservas()"><i class="fa-solid fa-arrows-rotate"></i></button>
          </div>
          <div class="scroll-list" id="reservas-container" style="max-height: 380px; overflow-y: auto;">
            <div class="empty-state">Nenhuma reserva ativa.</div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">
            <span><i class="fa-solid fa-clock"></i> Meus Prazos (Ativos)</span>
            <button class="refresh-btn" onclick="carregarPrazos()"><i class="fa-solid fa-arrows-rotate"></i></button>
          </div>
          <div class="scroll-list" id="prazos-container">
            <div class="empty-state">Nenhum empréstimo ativo no momento.</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbzJaUVD7wsW7ml4v6WuhV2Tz9z8yZSYLrvQNQrYmtOlwrnfQpq87I621XINr9tuEwKSjg/exec";

    let usuarioLogado = null;
    let acaoPendente = null;

    document.addEventListener('DOMContentLoaded', function() {
      const senhaInput = document.getElementById('senha-input');
      if (senhaInput) {
        senhaInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') executarLogin();
        });
      }
    });

    // ============================================================
    // UTILITÁRIOS
    // ============================================================
    function showToast(msg) {
      const t = document.getElementById('toast');
      if (t) {
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3500);
      }
    }

    function abrirConfirm(title, msg, callback) {
      document.getElementById('confirm-title').innerText = title;
      document.getElementById('confirm-msg').innerText = msg;
      acaoPendente = callback;
      document.getElementById('confirm-overlay').classList.remove('hidden');
    }

    function fecharConfirm() {
      document.getElementById('confirm-overlay').classList.add('hidden');
      acaoPendente = null;
    }

    function confirmarAcao() {
      if (acaoPendente) acaoPendente();
      fecharConfirm();
    }

    function fazerLogout() {
      usuarioLogado = null;
      document.getElementById('usuario-input').value = '';
      document.getElementById('senha-input').value = '';
      document.getElementById('app-principal').classList.add('hidden');
      document.getElementById('tela-login').classList.remove('hidden');
      showToast("Sessão encerrada com sucesso.");
    }

    // ============================================================
    // CHAMADOR GLOBAL DE JSONP PARA TODAS AS FUNÇÕES (Bypass CORS)
    // ============================================================
    function requisitarAPI(urlParametros, funcaoCallback) {
      const nomeCallbackGlobal = 'bkvert_cb_' + Math.round(Math.random() * 1000000);
      
      window[nomeCallbackGlobal] = function(dados) {
        funcaoCallback(dados);
        document.body.removeChild(scriptTag);
        delete window[nomeCallbackGlobal];
      };

      const scriptTag = document.createElement('script');
      const caractereUniao = urlParametros.includes('?') ? '&' : '?';
      scriptTag.src = urlParametros + caractereUniao + 'callback=' + nomeCallbackGlobal;
      document.body.appendChild(scriptTag);
    }

    // ============================================================
    // LOGIN TRATADO
    // ============================================================
    function executarLogin() {
      const u = document.getElementById('usuario-input').value.trim();
      const s = document.getElementById('senha-input').value.trim();
      const errBox = document.getElementById('login-erro');
      const errMsg = document.getElementById('login-erro-msg');
      const btn = document.getElementById('btn-login');

      if (!u || !s) {
        if (errMsg && errBox) {
          errMsg.innerText = "Preencha todos os campos.";
          errBox.classList.remove('hidden');
        }
        return;
      }

      if (errBox) errBox.classList.add('hidden');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando...';
      }

      const urlLogin = `${URL_API}?acao=login&usuario=${encodeURIComponent(u)}&senha=${encodeURIComponent(s)}`;

      requisitarAPI(urlLogin, function(res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = 'Entrar <i class="fa-solid fa-right-to-bracket"></i>';
        }

        if (res && res.sucesso === true) {
          usuarioLogado = res.usuario;
          document.getElementById('user-display-name').innerText = res.usuario.nomeCompleto;
          document.getElementById('user-display-contact').innerText = "@" + res.usuario.username;
          
          document.getElementById('tela-login').classList.add('hidden');
          document.getElementById('app-principal').classList.remove('hidden');
          
          carregarMural();
          carregarReservas();
          carregarPrazos();
          
          showToast("Bem-vindo ao BookVert, " + res.usuario.nomeCompleto + "!");
        } else {
          if (errMsg && errBox) {
            errMsg.innerText = res.mensagem || "Usuário ou senha incorretos.";
            errBox.classList.remove('hidden');
          }
        }
      });
    }

    // ============================================================
    // PEDIDO DE LIVRO 
    // ============================================================
    function validarFormPedido() {
      const t = document.getElementById('req-titulo').value.trim();
      const a = document.getElementById('req-autor').value.trim();
      const btn = document.getElementById('btn-publicar-pedido');
      if (t && a) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
      } else {
        btn.disabled = true;
        btn.style.opacity = '0.6';
        btn.style.cursor = 'not-allowed';
      }
    }

    function enviarSolicitacao() {
      if (!usuarioLogado) return;
      const t = document.getElementById('req-titulo').value.trim();
      const a = document.getElementById('req-autor').value.trim();

      if (!t || !a) {
        showToast("Preencha o título e o autor do livro.");
        return;
      }

      showToast("Enviando pedido ao servidor...");
      const urlCriar = `${URL_API}?acao=criarSolicitacao&idSolicitante=${encodeURIComponent(usuarioLogado.id)}&titulo=${encodeURIComponent(t)}&autor=${encodeURIComponent(a)}`;

      requisitarAPI(urlCriar, function(res) {
        if (res && res.sucesso) {
          document.getElementById('req-titulo').value = '';
          document.getElementById('req-autor').value = '';
          validarFormPedido();
          showToast(res.mensagem);
          carregarMural();
        } else {
          showToast("Erro: " + (res ? res.mensagem : "Desconhecido"));
        }
      });
    }

    // ============================================================
    // MURAL
    // ============================================================
    function carregarMural() {
      const c = document.getElementById('mural-container');
      if (!c) return;
      c.innerHTML = '<div class="empty-state">Sincronizando mural...</div>';

      const urlMural = `${URL_API}?acao=listarSolicitacoesAbertas`;

      requisitarAPI(urlMural, function(lista) {
        if (!lista || lista.length === 0) {
          c.innerHTML = '<div class="empty-state">Nenhum pedido pendente de livro no mural.</div>';
          return;
        }
        c.innerHTML = '';
        lista.forEach(function(item) {
          const div = document.createElement('div');
          div.className = 'book-item';
          let actionHtml = '';
          if (item.idSolicitante && usuarioLogado && item.idSolicitante.toString() === usuarioLogado.id.toString()) {
            actionHtml = '<span class="badge badge-muted">Seu Pedido</span>';
          } else {
            actionHtml = '<button class="btn btn-primary btn-sm" onclick="ofertarLivro(\'' + item.idSolicitacao + '\',\'' + item.livroId + '\',\'' + item.titulo.replace(/'/g, "\\'") + '\')">Eu Tenho!</button>';
          }
          div.innerHTML = '<div class="info"><div class="title">' + item.titulo + '</div><div class="author">' + item.autor + '</div><div class="requester"><i class="fa-regular fa-user"></i> por ' + item.nomeSolicitante + '</div></div><div>' + actionHtml + '</div>';
          c.appendChild(div);
        });
      });
    }

    function ofertarLivro(idSol, livreId, titulo) {
      if (!usuarioLogado) return;
      abrirConfirm(
        "Emprestar Livro",
        'Deseja disponibilizar e reservar o livro "' + titulo + '" para este usuário?',
        function() {
          showToast("Processando reserva...");
          const urlReservar = `${URL_API}?acao=reservarLivro&idSolicitacao=${encodeURIComponent(idSol)}&livroId=${encodeURIComponent(livreId)}&idDono=${encodeURIComponent(usuarioLogado.id)}`;
          
          requisitarAPI(urlReservar, function(res) {
            showToast(res.mensagem || "Ação processada.");
            carregarMural();
            carregarReservas();
          });
        }
      );
    }

    // ============================================================
    // RESERVAS
    // ============================================================
    function carregarReservas() {
      const c = document.getElementById('reservas-container');
      if (!c) return;
      c.innerHTML = '<div class="empty-state">Atualizando negociações...</div>';

      const urlReservados = `${URL_API}?acao=listarLivrosReservados&idUsuario=${encodeURIComponent(usuarioLogado.id)}`;

      requisitarAPI(urlReservados, function(lista) {
        if (!lista || lista.length === 0) {
          c.innerHTML = '<div class="empty-state">Nenhuma reserva ativa no momento.</div>';
          return;
        }
        c.innerHTML = '';
        const gridWrapper = document.createElement('div');
        gridWrapper.className = 'reserve-grid';
        lista.forEach(function(item) {
          const card = document.createElement('div');
          card.className = 'reserve-card';
          let tagTexto = item.papel === 'Dono' ? 'Você vai Emprestar' : 'Você vai Pegar';
          let tagClass = item.papel === 'Dono' ? 'badge-sage' : 'badge-clay';
          let btnAcaoHtml = item.papel === 'Dono'
            ? '<button class="btn-confirm" onclick="confirmarEntregaFisica(\'' + item.idSolicitacao + '\',\'' + item.livroId + '\',\'' + item.titulo.replace(/'/g, "\\'") + '\')"><i class="fa-solid fa-handshake"></i> Confirmei Entrega</button>'
            : '<div class="waiting-label"><i class="fa-solid fa-spinner fa-spin"></i> Aguardando Confirmação do Dono</div>';
          let foneLimpo = item.outroContato ? item.outroContato.toString().replace(/\D/g, '') : '';
          let wppHtml = foneLimpo
            ? '<a href="https://wa.me/55' + foneLimpo + '?text=Ol%C3%A1%20' + encodeURIComponent(item.outroNome) + ',%20falo%20do%20BookVert%20sobre%20o%20livro%20' + encodeURIComponent(item.titulo) + '." target="_blank" class="btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> Falar com ' + item.outroNome.split(' ')[0] + '</a>'
            : '<span class="waiting-label">Contato Indisponível</span>';
          card.innerHTML = '<div><span class="badge ' + tagClass + '" style="margin-bottom:8px;">' + tagTexto + '</span><div class="r-title">' + item.titulo + '</div><div class="r-author">' + item.autor + '</div></div><div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">' + wppHtml + btnAcaoHtml + '</div>';
          gridWrapper.appendChild(card);
        });
        c.appendChild(gridWrapper);
      });
    }

    function confirmarEntregaFisica(idSol, livreId, titulo) {
      abrirConfirm(
        "Confirmar Entrega Física",
        'Você confirma que entregou o livro "' + titulo + '" em mãos para o solicitante e deseja iniciar o prazo de devolução?',
        function() {
          const urlConfirmar = `${URL_API}?acao=confirmarEmprestimoFisico&idSolicitacao=${encodeURIComponent(idSol)}&livroId=${encodeURIComponent(livreId)}`;
          requisitarAPI(urlConfirmar, function(res) {
            showToast(res.mensagem || "Empréstimo ativado!");
            carregarReservas();
            carregarPrazos();
          });
        }
      );
    }

    // ============================================================
    // PRAZOS
    // ============================================================
    function carregarPrazos() {
      const c = document.getElementById('prazos-container');
      if (!c) return;
      c.innerHTML = '<div class="empty-state">Carregando prazos...</div>';

      const urlPainel = `${URL_API}?acao=obterPainelUsuario&idUsuario=${encodeURIComponent(usuarioLogado.id)}`;

      requisitarAPI(urlPainel, function(paineis) {
        let itens = [];
        if (paineis && paineis.emprestados) paineis.emprestados.forEach(function(x) { x.tipo = 'emprestei'; itens.push(x); });
        if (paineis && paineis.pegos) paineis.pegos.forEach(function(x) { x.tipo = 'peguei'; itens.push(x); });

        if (itens.length === 0) {
          c.innerHTML = '<div class="empty-state">Nenhum empréstimo físico registrado em andamento.</div>';
          return;
        }
        c.innerHTML = '';
        itens.forEach(function(item) {
          const div = document.createElement('div');
          div.className = 'loan-item';
          let badgeHtml = item.tipo === 'emprestei' ? '<span class="badge badge-sage">Emprestado por mim</span>' : '<span class="badge badge-clay">Peguei Emprestado</span>';
          let foneLimpo = item.outroContato ? item.outroContato.toString().replace(/\D/g, '') : '';
          let acaoContatoHtml = foneLimpo
            ? '<a href="https://wa.me/55' + foneLimpo + '?text=Ol%C3%A1%20' + encodeURIComponent(item.outroNome) + ',%20estou%20entrando%20em%20contato%20pelo%20BookVert%20sobre%20o%20empr%C3%A9stimo%20do%20livro%20' + encodeURIComponent(item.titulo) + '." target="_blank" class="btn-whatsapp" style="padding:6px 12px; font-size:11px; margin-top:4px;"><i class="fa-brands fa-whatsapp"></i> Falar com ' + item.outroNome.split(' ')[0] + '</a>'
            : '<span class="waiting-label" style="padding:4px 8px; font-size:11px;">Sem número</span>';
          div.innerHTML = '<div class="loan-item-main"><div class="info"><div style="margin-bottom:4px;">' + badgeHtml + '</div><div class="title" style="font-size:13px; font-weight:600;">' + item.titulo + '</div><div class="author" style="font-size:11px; color:var(--muted);">' + item.autor + '</div></div><div class="deadline"><div class="label-sm">' + (item.tipo === 'emprestei' ? 'Prazo Fim' : 'Devolver Até') + '</div><div class="date" style="font-size:12px;">' + item.dataPrazo + '</div></div></div><div class="divider" style="opacity:0.3; margin:4px 0;"></div><div style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span style="font-size:11px; color:var(--muted); font-weight:500;"><i class="fa-regular fa-user"></i> Contato: <b>' + item.outroNome + '</b></span><div style="width:140px;">' + acaoContatoHtml + '</div></div>';
          c.appendChild(div);
        });
      });
    }   
  </script>
</body>
</html>
